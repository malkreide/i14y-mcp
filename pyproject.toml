[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i14y-mcp"
version = "0.1.0"
description = "MCP server for the I14Y interoperability platform — Switzerland's national metadata catalogue"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "malkreide" }]
keywords = ["mcp", "model-context-protocol", "llm", "swiss-open-data", "i14y", "dcat", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
i14y-mcp = "i14y_mcp.server:main"

[project.urls]
Homepage = "https://github.com/malkreide/i14y-mcp"
Repository = "https://github.com/malkreide/i14y-mcp"
Issues = "https://github.com/malkreide/i14y-mcp/issues"
"Data source" = "https://www.i14y.admin.ch"
Portfolio = "https://github.com/malkreide/swiss-public-data-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/i14y_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real I14Y API (excluded from CI)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
