name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      # Zweites, eigenstaendiges Gate. `ruff check` belegt kein Format: ein
      # gruener Linter neben einem roten `ruff format --check` ist ein
      # gewoehnlicher Zustand, kein Widerspruch — die beiden pruefen
      # Verschiedenes. Der Regelsatz oben steht in `select`, hier ist das
      # Ergebnis selbst das Kriterium.
      #
      # Eigener Schritt, damit im Log steht, welches der beiden Gates
      # ausgeloest hat. Zusammengezogen waere die Antwort auf «warum ist die
      # CI rot» eine Suche statt eine Zeile.
      #
      # Kein `--line-length`: die Breite entscheidet die `[tool.ruff]`-Sektion
      # in pyproject.toml, nicht dieser Workflow.
      - name: Format
        run: ruff format --check src/ tests/ scripts/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py
